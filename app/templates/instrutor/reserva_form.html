<!-- templates/instrutor/criar_reserva.html -->
{% extends 'base/base.html' %}

{% block title %}Criar Reserva{% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/instrutor.css') }}">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{% endblock %}

{% block content %}
<div class="container-coordenador">
    <div class="card">
        <h2 class="form-title"><i class="fas fa-calendar-plus"></i> Nova Reserva</h2>
        
        <form method="POST" class="form-reserva" action="{{ url_for('instrutor_bp.criar_reserva') }}">
            <div class="form-group">
                <label for="nome_sala">Sala:</label>
                <select name="nome_sala" id="nome_sala" class="form-control" required>
                    <option value="">Selecione uma sala</option>
                    {% for sala in salas %}
                    <option value="{{ sala.nome_sala }}">{{ sala.nome_sala }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="responsavel">Seu e-mail:</label>
                <input type="email" name="responsavel" id="responsavel" class="form-control" value="{{ session.get('user_email', '') }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="data_reserva">Data:</label>
                    <input type="text" name="data_reserva" id="data_reserva" class="form-control datepicker" placeholder="DD/MM/AAAA" required>
                </div>
                <div class="form-group">
                    <label for="hora_inicio">Início:</label>
                    <input type="text" name="hora_inicio" id="hora_inicio" class="form-control timepicker" placeholder="HH:MM" required>
                </div>
                <div class="form-group">
                    <label for="hora_fim">Término:</label>
                    <input type="text" name="hora_fim" id="hora_fim" class="form-control timepicker" placeholder="HH:MM" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Reservar
                </button>
                <a href="{{ url_for('instrutor_bp.painel_instrutor') }}" class="btn btn-cancelar">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
<script>
    flatpickr(".datepicker", { dateFormat: "d/m/Y", locale: "pt" });
    flatpickr(".timepicker", { enableTime: true, noCalendar: true, dateFormat: "H:i" });
</script>
{% endblock %}
