<!-- templates/instrutor/painel_instrutor.html -->
{% extends 'base/base.html' %}
{% block content %}
<div class="container">
    <h2 class="mb-4">Painel do Instrutor</h2>
    <div class="row">
        {% for sala in salas %}
        <div class="col-md-4">
            <div class="card mb-4 shadow-sm border rounded-3">
                <div class="card-body">
                    <h5 class="card-title">{{ sala.nome_sala }}</h5>
                    <p class="card-text">Status: <strong>{{ sala.status_sala }}</strong></p>
                    <a href="{{ url_for('instrutor_bp.criar_reserva') }}?sala_id={{ sala.id_sala }}"
                        class="btn btn-primary w-100">Reservar</a>
                </div>
            </div>
        </div>
        {% else %}
        <p>Nenhuma sala disponível.</p>
        {% endfor %}
    </div>
</div>
{% endblock %}
