{% extends 'base/base.html' %}

{% block title %}Criar Reserva{% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/coordenador.css') }}">
<!-- Adicionando o plugin flatpickr para seleção de data/hora -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
{% endblock %}

{% block content %}
<div class="container-coordenador">
    <div class="card">
        <h2 class="form-title"><i class="fas fa-calendar-plus"></i> Criar Nova Reserva</h2>
        
        <form method="POST" class="form-reserva">
            <div class="form-group">
                <label for="nome_sala">Sala:</label>
                <select name="nome_sala" id="nome_sala" class="form-control" required>
                    <option value="">Selecione uma sala</option>
                    {% for sala in salas %}
                    <option value="{{ sala }}">{{ sala.nome_sala }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label for="email">Email do usuário:</label>
                <input type="email" name="email" id="email" class="form-control" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="data_reserva">Data da reserva:</label>
                    <input type="text" name="data_reserva" id="data_res" class="form-control datepicker" 
                           placeholder="DD/MM/AAAA" required>
                </div>
                
                <div class="form-group">
                    <label for="datetime_inicio">Horário de início:</label>
                    <input type="text" name="inicio" id="datetime_inicio" class="form-control timepicker" 
                           placeholder="HH:MM" required>
                </div>
                
                <div class="form-group">
                    <label for="datetime_termino">Horário de término:</label>
                    <input type="text" name="termino" id="datetime_termino" class="form-control timepicker" 
                           placeholder="HH:MM" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Salvar Reserva
                </button>
                <a href="{{ url_for('coordenador_bp.listar_reservas') }}" class="btn btn-cancelar">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
<script src="https://npmcdn.com/flatpickr/dist/l10n/pt.js"></script>
<script src="{{ url_for('static', filename='js/coordenador.js') }}"></script>
{% endblock %}
