{% extends 'base/base.html' %}

{% block title %}Cadastro de Usuário{% endblock %}

{% block style %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/coordenador.css') }}">
{% endblock %}

{% block content %}
<div class="container-coordenador">
    <div class="card">
        <h1 class="form-title"><i class="fas fa-user-plus"></i> Cadastro de Usuário</h1>

        <form action="{{ url_for('coordenador_bp.cadastro_usuario') }}" method="POST" class="user-form">
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email" maxlength="60" class="form-control" required
                    placeholder="exemplo@dominio.com">
            </div>

            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" maxlength="60" class="form-control" required
                    placeholder="Digite o nome completo">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="matricula">Matrícula:</label>
                    <input type="text" id="matricula" name="matricula" maxlength="5" minlength="5" class="form-control"
                        required placeholder="5 dígitos" pattern="[0-9]{5}" title="Digite exatamente 5 números">
                </div>

                <div class="form-group">
                    <label for="funcao">Função:</label>
                    <select name="funcao" id="funcao" class="form-control" required>
                        <option value="">Selecione...</option>
                        <option value="Coordenador">Coordenador</option>
                        <option value="Instrutor">Instrutor</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <div class="password-container">
                    <input type="password" id="senha" name="senha" maxlength="11" class="form-control" required
                        placeholder="Máximo 11 caracteres">
                    <button type="button" class="btn-toggle-password" aria-label="Mostrar senha">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">
                    <i class="fas fa-save"></i> Cadastrar
                </button>
                <a href="{{ url_for('coordenador_bp.listar_funcionarios') }}" class="btn btn-secondary">
                    Cancelar
                </a>
            </div>
        </form>
    </div>
</div>

<script src="{{ url_for('static', filename='js/coordenador.js') }}"></script>
{% endblock %}
